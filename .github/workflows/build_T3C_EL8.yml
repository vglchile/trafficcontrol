name: Build and Release T3C for EL8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Build Installer Packagers
      run: |
        ./pkg -8 -v -L -S -b cache-config_build
        echo "PACKAGED_OUTPUTDATE=$(date +"%Y.%m.%d.%H%M")_RHEL8" >> $GITHUB_ENV
        
    - name: Publish Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.PACKAGED_OUTPUTDATE }}
        body: ${{ env.PACKAGED_OUTPUTDATE }}
        files: dist/*
